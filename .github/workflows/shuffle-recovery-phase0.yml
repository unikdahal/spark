name: Shuffle recovery Phase 0

on:
  pull_request:
    branches:
      - spip/shuffle-recovery-phase0
  workflow_dispatch:
    inputs:
      opportunity-corpus-mode:
        description: Opportunity evidence corpus size
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - larger

permissions:
  contents: read

concurrency:
  group: shuffle-recovery-phase0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opportunity-analyzer:
    name: Opportunity analyzer and weighted gate (SQL, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPPORTUNITY_CORPUS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.opportunity-corpus-mode || 'smoke' }}
      OPPORTUNITY_DIR: ${{ github.workspace }}/sql/core/target/shuffle-recovery-phase0/opportunity

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine integration base
        id: integration-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-phase0:refs/remotes/origin/spip/shuffle-recovery-phase0
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-phase0)"
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache SBT and Maven launchers
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
          key: shuffle-recovery-build-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
          restore-keys: |
            shuffle-recovery-build-${{ runner.os }}-
            build-${{ runner.os }}-

      - name: Cache Coursier repository
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: shuffle-recovery-coursier-${{ runner.os }}-17-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
          restore-keys: |
            shuffle-recovery-coursier-${{ runner.os }}-17-
            coursier-${{ runner.os }}-17-
            coursier-${{ runner.os }}-

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ steps.integration-base.outputs.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Run Scala style checks
        run: timeout --signal=TERM 20m ./dev/scalastyle "-Phadoop-3 -Phive"

      - name: Run Java checkstyle when Java is affected
        env:
          BASE_SHA: ${{ steps.integration-base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}...HEAD" -- '*.java' | grep -q .; then
            ./dev/lint-java
          else
            echo "No Java files changed; Java checkstyle is not applicable."
          fi

      - name: Compile SQL production and test code
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${GITHUB_WORKSPACE}/sql/core/target/shuffle-recovery-phase0"
          mkdir -p "${diagnostic_dir}"
          compile_log="${diagnostic_dir}/sql-test-compile.log"
          set +e
          ./build/sbt -Phadoop-3 -Phive "sql/Test/compile" 2>&1 | tee "${compile_log}"
          compile_status=${PIPESTATUS[0]}
          set -e
          if [[ ${compile_status} -ne 0 ]]; then
            {
              echo "### sql/Test/compile diagnostics"
              echo '```text'
              if ! grep -E '^\[error\]' "${compile_log}" | tail -n 200; then
                tail -n 200 "${compile_log}"
              fi
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${compile_status}"

      - name: Run focused opportunity analyzer suite
        env:
          SPARK_SHUFFLE_RECOVERY_OPPORTUNITY_OUTPUT: >-
            ${{ github.workspace }}/sql/core/target/shuffle-recovery-phase0/analyzer-records.jsonl
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityAnalyzerSuite"

      - name: Run weighted runtime, correlation, and report suites
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityStudySuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryRuntimeWeightsSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryRuntimeCorrelationSuite"

      - name: Run adaptive partition-rule regression suite
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryAdaptivePartitionRulesSuite"

      - name: Run AQE-on/off TPC opportunity corpus
        env:
          SPARK_SHUFFLE_RECOVERY_CORPUS_MODE: ${{ env.OPPORTUNITY_CORPUS_MODE }}
          SPARK_SHUFFLE_RECOVERY_OPPORTUNITY_DIR: ${{ env.OPPORTUNITY_DIR }}
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityCorpusSuite"

      - name: Run listener-manager regression suite
        run: >-
          ./build/sbt -Phadoop-3 -Phive
          "sql/testOnly org.apache.spark.sql.util.ExecutionListenerManagerSuite"

      - name: Validate focused test discovery and evidence accounting
        shell: bash
        run: |
          set -euo pipefail
          analyzer_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryOpportunityAnalyzerSuite*.xml' -print -quit)"
          study_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryOpportunityStudySuite*.xml' -print -quit)"
          retry_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryRuntimeWeightsSuite*.xml' -print -quit)"
          correlation_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryRuntimeCorrelationSuite*.xml' -print -quit)"
          corpus_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryOpportunityCorpusSuite*.xml' -print -quit)"
          adaptive_report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryAdaptivePartitionRulesSuite*.xml' -print -quit)"
          for report in \
            "${analyzer_report}" \
            "${study_report}" \
            "${retry_report}" \
            "${correlation_report}" \
            "${corpus_report}" \
            "${adaptive_report}"; do
            if [[ -z "${report}" ]]; then
              echo "A focused Phase 0-A suite produced no test report." >&2
              exit 1
            fi
          done

          analyzer_evidence="sql/core/target/shuffle-recovery-phase0/analyzer-records.jsonl"
          if [[ ! -s "${analyzer_evidence}" ]]; then
            echo "Opportunity analyzer produced no evidence records." >&2
            exit 1
          fi
          grep -q '"executionId":"aqe-off"' "${analyzer_evidence}"
          grep -q '"executionId":"aqe-on"' "${analyzer_evidence}"
          grep -q '"exchangeOrdinal":' "${analyzer_evidence}"
          grep -q '"lineageDeterminism":' "${analyzer_evidence}"
          grep -q '"eligible":' "${analyzer_evidence}"

          raw="${OPPORTUNITY_DIR}/opportunity-${OPPORTUNITY_CORPUS_MODE}.jsonl"
          rendered="${OPPORTUNITY_DIR}/opportunity-${OPPORTUNITY_CORPUS_MODE}.md"
          if [[ ! -s "${raw}" || ! -s "${rendered}" ]]; then
            echo "Weighted opportunity corpus produced empty raw/report evidence." >&2
            exit 1
          fi
          grep -q '"schemaVersion":1' "${raw}"
          grep -q '"disposition":"WEIGHTED"' "${raw}"
          grep -q 'Gate result:' "${rendered}"
          grep -q 'Scope curve and correlation coverage' "${rendered}"
          grep -q 'Failure-point opportunity' "${rendered}"
          grep -q 'Unweighted / excluded accounting' "${rendered}"
          grep -q 'TPC-DS' "${rendered}"
          grep -q 'TPC-H' "${rendered}"

          {
            echo "### Phase 0-A weighted opportunity evidence"
            echo "Corpus mode: \`${OPPORTUNITY_CORPUS_MODE}\`"
            echo
            cat "${rendered}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Phase 0-A evidence and focused test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-phase0-opportunity-${{ env.OPPORTUNITY_CORPUS_MODE }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            sql/core/target/shuffle-recovery-phase0/sql-test-compile.log
            sql/core/target/shuffle-recovery-phase0/analyzer-records.jsonl
            sql/core/target/shuffle-recovery-phase0/opportunity/**
            **/target/test-reports/*ShuffleRecoveryOpportunityAnalyzerSuite*.xml
            **/target/test-reports/*ShuffleRecoveryOpportunityStudySuite*.xml
            **/target/test-reports/*ShuffleRecoveryRuntimeWeightsSuite*.xml
            **/target/test-reports/*ShuffleRecoveryRuntimeCorrelationSuite*.xml
            **/target/test-reports/*ShuffleRecoveryOpportunityCorpusSuite*.xml
            **/target/test-reports/*ShuffleRecoveryAdaptivePartitionRulesSuite*.xml
            **/target/test-reports/*ExecutionListenerManagerSuite*.xml
            **/target/*.log
