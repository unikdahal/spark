name: Shuffle recovery Phase 0

on:
  pull_request:
    branches:
      - spip/shuffle-recovery-phase0
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation tier
        required: true
        default: focused
        type: choice
        options:
          - focused
          - full
          - evidence
      opportunity_corpus_mode:
        description: Opportunity corpus size outside evidence mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - evidence

permissions:
  contents: read

concurrency:
  group: shuffle-recovery-phase0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      core: ${{ steps.scope.outputs.core }}
      cold: ${{ steps.scope.outputs.cold }}
      opportunity: ${{ steps.scope.outputs.opportunity }}
      workflow: ${{ steps.scope.outputs.workflow }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'focused' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-phase0:refs/remotes/origin/spip/shuffle-recovery-phase0
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-phase0)"
          changed="$(git diff --name-only "${base}...HEAD")"
          printf '%s\n' "${changed}"

          core=false
          cold=false
          opportunity=false
          workflow=false
          code=false

          if grep -q '^\.github/workflows/shuffle-recovery-phase0\.yml$' <<<"${changed}"; then
            workflow=true
            core=true
            cold=true
            opportunity=true
            code=true
          fi
          if grep -q '^core/' <<<"${changed}"; then
            core=true
            cold=true
            code=true
          fi
          if grep -q '^sql/core/src/.*ShuffleRecoveryOpportunity' <<<"${changed}" || \
              grep -q '^sql/core/src/.*ShuffleRecoveryRuntime' <<<"${changed}" || \
              grep -q '^sql/core/src/.*ShuffleRecoveryFailureDistribution' <<<"${changed}"; then
            opportunity=true
            code=true
          fi
          if grep -q '^sql/core/src/test/scala/org/apache/spark/shuffle/' <<<"${changed}"; then
            cold=true
            code=true
          fi
          if grep -q '^sql/' <<<"${changed}" && \
              ! grep -Eq '^sql/core/src/(main|test)/scala/org/apache/spark/(sql/execution/exchange|shuffle)/' <<<"${changed}"; then
            # Unknown SQL changes are conservatively treated as affecting both SQL evidence paths.
            cold=true
            opportunity=true
            code=true
          fi
          if grep -Eq '\.(scala|java|py|sh)$' <<<"${changed}"; then
            code=true
          fi

          echo "mode=${REQUESTED_MODE}" >> "${GITHUB_OUTPUT}"
          echo "core=${core}" >> "${GITHUB_OUTPUT}"
          echo "cold=${cold}" >> "${GITHUB_OUTPUT}"
          echo "opportunity=${opportunity}" >> "${GITHUB_OUTPUT}"
          echo "workflow=${workflow}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  docs:
    name: Evidence package and patch hygiene
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-phase0:refs/remotes/origin/spip/shuffle-recovery-phase0
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-phase0)"
          git diff --check "${base}...HEAD"

      - name: Validate final evidence package
        shell: bash
        run: |
          set -euo pipefail
          root="docs/shuffle-recovery/phase0"
          test -s "${root}/README.md"
          test -s "${root}/mechanism.md"
          test -s "${root}/audit.md"
          test -s "${root}/summary.json"
          python -m json.tool "${root}/summary.json" >/dev/null
          grep -q 'MECHANISM_FEASIBLE / VALUE_GATE_NOT_MET' "${root}/README.md"
          grep -q '19.4%' "${root}/README.md"
          grep -q '40 + 16R' "${root}/README.md"
          grep -q 'O(M x R)' "${root}/README.md"
          grep -q 'current shuffle id' "${root}/mechanism.md"
          grep -q 'whole fresh map-stage recomputation' "${root}/mechanism.md"
          grep -q 'literalTotalHistoryTargetSatisfied' "${root}/summary.json"

  style:
    name: Global Phase 0 style gate
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'focused' || needs.scope.outputs.code == 'true' || needs.scope.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache SBT and Maven launchers
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
          key: shuffle-recovery-build-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
          restore-keys: |
            shuffle-recovery-build-${{ runner.os }}-
            build-${{ runner.os }}-

      - name: Cache Coursier repository
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: shuffle-recovery-coursier-${{ runner.os }}-17-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
          restore-keys: |
            shuffle-recovery-coursier-${{ runner.os }}-17-
            coursier-${{ runner.os }}-17-
            coursier-${{ runner.os }}-

      - name: Run Scala style checks once
        run: timeout --signal=TERM 20m ./dev/scalastyle "-Phadoop-3 -Phive"

      - name: Run Java checkstyle when Java is affected
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-phase0:refs/remotes/origin/spip/shuffle-recovery-phase0
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-phase0)"
          if git diff --name-only "${base}...HEAD" -- '*.java' | grep -q .; then
            ./dev/lint-java
          else
            echo "No Java files changed; Java checkstyle is not applicable."
          fi

  core:
    name: Core provider, trust, scheduler, failure and upstream regressions (JDK 17)
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'focused' || needs.scope.outputs.core == 'true' || needs.scope.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-core-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-core-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile Core production and test code
        shell: bash
        run: |
          set -uo pipefail
          dir="${GITHUB_WORKSPACE}/core/target/shuffle-recovery-phase0"
          mkdir -p "${dir}"
          log="${dir}/core-test-compile.log"
          set +e
          ./build/sbt -Phadoop-3 "core/Test/compile" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Run accumulated recovery correctness suites
        run: |
          ./build/sbt -Phadoop-3 \
            "core/testOnly org.apache.spark.shuffle.ReferenceShuffleProviderSuite org.apache.spark.shuffle.ShuffleRecoveryManifestSuite org.apache.spark.shuffle.ShuffleRecoverySchedulerAdoptionSuite org.apache.spark.shuffle.ShuffleRecoveryAdoptedFailureSuite"

      - name: Run hot-boundary upstream regressions
        run: |
          ./build/sbt -Phadoop-3 \
            "core/testOnly org.apache.spark.shuffle.sort.IndexShuffleBlockResolverSuite org.apache.spark.shuffle.sort.SortShuffleManagerSuite org.apache.spark.scheduler.DAGSchedulerSuite"

      - name: Run independent-JVM persistent read proof
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/shuffle-recovery-reference-provider-${GITHUB_RUN_ID}"
          report="${GITHUB_WORKSPACE}/core/target/shuffle-recovery-phase0/reference-provider/read-representation.md"
          rm -rf "${proof_root}"
          mkdir -p "$(dirname "${report}")"
          ./build/sbt -Phadoop-3 \
            "project core" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.shuffle.ReferenceShuffleProviderProcess write ${proof_root}" \
            "Test/runMain org.apache.spark.shuffle.ReferenceShuffleProviderProcess read ${proof_root} ${report}"
          grep -q '40 + 16R' "${report}"
          grep -q '| 2 | 4096 |' "${report}"
          if find "${proof_root}" -mindepth 1 -print -quit | grep -q .; then
            echo "Cross-JVM proof left group artifacts behind." >&2
            exit 1
          fi
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate Core test discovery
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ReferenceShuffleProviderSuite \
            ShuffleRecoveryManifestSuite \
            ShuffleRecoverySchedulerAdoptionSuite \
            ShuffleRecoveryAdoptedFailureSuite \
            IndexShuffleBlockResolverSuite \
            SortShuffleManagerSuite \
            DAGSchedulerSuite; do
            report="$(find core -type f -path '*/test-reports/*' -name "*${suite}*.xml" -print -quit)"
            if [[ -z "${report}" ]]; then
              echo "Core suite ${suite} produced no test report." >&2
              exit 1
            fi
          done

      - name: Upload Core freeze evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-phase0-core-${{ github.run_id }}
          if-no-files-found: error
          path: |
            core/target/shuffle-recovery-phase0/**
            **/target/test-reports/*ReferenceShuffleProviderSuite*.xml
            **/target/test-reports/*ShuffleRecoveryManifestSuite*.xml
            **/target/test-reports/*ShuffleRecoverySchedulerAdoptionSuite*.xml
            **/target/test-reports/*ShuffleRecoveryAdoptedFailureSuite*.xml
            **/target/test-reports/*IndexShuffleBlockResolverSuite*.xml
            **/target/test-reports/*SortShuffleManagerSuite*.xml
            **/target/test-reports/*DAGSchedulerSuite*.xml

  cold-process:
    name: Cold-process driver replacement proof (SQL, JDK 17)
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'focused' || needs.scope.outputs.cold == 'true' || needs.scope.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COLD_EVIDENCE_DIR: ${{ github.workspace }}/sql/core/target/shuffle-recovery-phase0/cold-process
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-sql-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-sql-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile SQL production and test code
        run: ./build/sbt -Phadoop-3 -Phive "sql/Test/compile"

      - name: Run independent-JVM cold-process matrix and negative controls
        shell: bash
        env:
          SPARK_SHUFFLE_RECOVERY_COLD_PROCESS_EVIDENCE_DIR: ${{ env.COLD_EVIDENCE_DIR }}
          SPARK_SHUFFLE_RECOVERY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${COLD_EVIDENCE_DIR}"
          mkdir -p "${COLD_EVIDENCE_DIR}"
          cleanup() {
            pkill -f 'org.apache.spark.shuffle.ShuffleRecoveryColdProcessProcess' || true
            find "${RUNNER_TEMP}" -maxdepth 1 \
              -name 'shuffle-recovery-cold-work-*' -exec rm -rf {} + || true
          }
          trap cleanup EXIT
          timeout --signal=TERM --kill-after=30s 45m \
            ./build/sbt -Phadoop-3 -Phive \
              "project sql" \
              "set Test / fork := true" \
              "testOnly org.apache.spark.shuffle.ShuffleRecoveryColdProcessSuite"

      - name: Validate cold-process evidence
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="${COLD_EVIDENCE_DIR}/cold-process-evidence.tsv"
          test -s "${evidence}"
          grep -q $'replacement\tsparse\tnone' "${evidence}"
          grep -q $'replacement\tempty\tnone' "${evidence}"
          grep -q $'replacement\tlarge\tnone' "${evidence}"
          grep -q $'replacement\twide\tnone' "${evidence}"
          awk -F '\t' -v expected="${EXPECTED_COMMIT}" '
            NR == 1 { for (i = 1; i <= NF; i++) if ($i == "testedCommit") c = i; next }
            $c != expected { print "unexpected testedCommit: " $c > "/dev/stderr"; exit 1 }
          ' "${evidence}"
          for control in \
            disabled group-diff generation-not-later source-token provider-compat \
            manifest-absent digest-collision artifact-missing claim-unavailable reservation-stale; do
            grep -q $'replacement\tnegative\t'"${control}" "${evidence}"
          done
          report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryColdProcessSuite*.xml' -print -quit)"
          test -n "${report}"
          {
            echo "### Phase 0-B cold-process evidence"
            echo
            echo '```text'
            cat "${evidence}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload cold-process evidence and child logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-phase0-cold-process-${{ github.run_id }}
          if-no-files-found: error
          path: |
            sql/core/target/shuffle-recovery-phase0/cold-process/**
            **/target/test-reports/*ShuffleRecoveryColdProcessSuite*.xml

  opportunity:
    name: Opportunity analyzer and weighted gate (SQL, JDK 17)
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'focused' || needs.scope.outputs.opportunity == 'true' || needs.scope.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPPORTUNITY_DIR: ${{ github.workspace }}/sql/core/target/shuffle-recovery-phase0/opportunity
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select opportunity corpus
        shell: bash
        env:
          VALIDATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'focused' }}
          REQUESTED_CORPUS: ${{ github.event_name == 'workflow_dispatch' && inputs.opportunity_corpus_mode || 'smoke' }}
        run: |
          set -euo pipefail
          corpus="${REQUESTED_CORPUS}"
          if [[ "${VALIDATION_MODE}" == "evidence" ]]; then
            corpus=evidence
          fi
          echo "OPPORTUNITY_CORPUS_MODE=${corpus}" >> "${GITHUB_ENV}"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-sql-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-sql-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile SQL production and test code
        run: ./build/sbt -Phadoop-3 -Phive "sql/Test/compile"

      - name: Run focused opportunity analyzer and weighting suites
        env:
          SPARK_SHUFFLE_RECOVERY_OPPORTUNITY_OUTPUT: ${{ github.workspace }}/sql/core/target/shuffle-recovery-phase0/analyzer-records.jsonl
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityAnalyzerSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityStudySuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryRuntimeWeightsSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryRuntimeCorrelationSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryFailureDistributionSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryAdaptivePartitionRulesSuite org.apache.spark.sql.util.ExecutionListenerManagerSuite"

      - name: Run AQE-on/off TPC opportunity corpus
        env:
          SPARK_SHUFFLE_RECOVERY_CORPUS_MODE: ${{ env.OPPORTUNITY_CORPUS_MODE }}
          SPARK_SHUFFLE_RECOVERY_OPPORTUNITY_DIR: ${{ env.OPPORTUNITY_DIR }}
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityCorpusSuite"

      - name: Validate opportunity evidence
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ShuffleRecoveryOpportunityAnalyzerSuite \
            ShuffleRecoveryOpportunityStudySuite \
            ShuffleRecoveryRuntimeWeightsSuite \
            ShuffleRecoveryRuntimeCorrelationSuite \
            ShuffleRecoveryFailureDistributionSuite \
            ShuffleRecoveryOpportunityCorpusSuite \
            ShuffleRecoveryAdaptivePartitionRulesSuite \
            ExecutionListenerManagerSuite; do
            report="$(find sql -type f -path '*/test-reports/*' -name "*${suite}*.xml" -print -quit)"
            test -n "${report}"
          done
          raw="${OPPORTUNITY_DIR}/opportunity-${OPPORTUNITY_CORPUS_MODE}.jsonl"
          rendered="${OPPORTUNITY_DIR}/opportunity-${OPPORTUNITY_CORPUS_MODE}.md"
          correlation="${OPPORTUNITY_DIR}/correlation-${OPPORTUNITY_CORPUS_MODE}.md"
          reconciliation="${OPPORTUNITY_DIR}/reconciliation-${OPPORTUNITY_CORPUS_MODE}.tsv"
          sensitivity="${OPPORTUNITY_DIR}/sensitivity-${OPPORTUNITY_CORPUS_MODE}.md"
          for evidence_file in "${raw}" "${rendered}" "${correlation}" \
              "${reconciliation}" "${sensitivity}"; do
            test -s "${evidence_file}"
          done
          grep -q 'Gate result:' "${rendered}"
          grep -q 'Scope curve and correlation coverage' "${rendered}"
          grep -q 'Failure-point opportunity' "${rendered}"
          grep -q 'Frozen minimum completed-task-time coverage: 95.0%' "${correlation}"
          if [[ "${OPPORTUNITY_CORPUS_MODE}" == "smoke" ]]; then
            grep -q 'spark-in-tree-tpc-smoke-v2' "${rendered}"
          else
            grep -q 'spark-in-tree-tpc-evidence-v2' "${rendered}"
            if grep -q '| SYNTHETIC |' "${rendered}"; then
              echo "Synthetic evidence leaked into the benchmark headline report." >&2
              exit 1
            fi
          fi
          {
            echo "### Phase 0-A weighted opportunity evidence"
            echo "Corpus mode: \`${OPPORTUNITY_CORPUS_MODE}\`"
            echo
            cat "${correlation}"
            echo
            cat "${rendered}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload opportunity evidence and focused test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-phase0-opportunity-${{ env.OPPORTUNITY_CORPUS_MODE }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            sql/core/target/shuffle-recovery-phase0/analyzer-records.jsonl
            sql/core/target/shuffle-recovery-phase0/opportunity/**
            **/target/test-reports/*ShuffleRecoveryOpportunityAnalyzerSuite*.xml
            **/target/test-reports/*ShuffleRecoveryOpportunityStudySuite*.xml
            **/target/test-reports/*ShuffleRecoveryRuntimeWeightsSuite*.xml
            **/target/test-reports/*ShuffleRecoveryRuntimeCorrelationSuite*.xml
            **/target/test-reports/*ShuffleRecoveryFailureDistributionSuite*.xml
            **/target/test-reports/*ShuffleRecoveryOpportunityCorpusSuite*.xml
            **/target/test-reports/*ShuffleRecoveryAdaptivePartitionRulesSuite*.xml
            **/target/test-reports/*ExecutionListenerManagerSuite*.xml
