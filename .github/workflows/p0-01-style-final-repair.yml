name: P0-01 temporary final style repair

on:
  push:
    branches:
      - spip/p0-01-opportunity-analyzer

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: spip/p0-01-opportunity-analyzer
      - name: Fix final Scala style violations
        shell: bash
        run: |
          set -euo pipefail
          file=sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryOpportunityAnalyzerSuite.scala
          test "$(grep -c 'override def dataType = child.dataType' "${file}")" -eq 1
          test "$(grep -c 'throw new AssertionError("unknown partitioning must not be inspected")' "${file}")" -eq 1
          sed -i 's/override def dataType = child.dataType/override def dataType: org.apache.spark.sql.types.DataType = child.dataType/' "${file}"
          sed -i 's/throw new AssertionError("unknown partitioning must not be inspected")/throw new IllegalStateException("unknown partitioning must not be inspected")/' "${file}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${file}"
          git commit -m "Fix final analyzer suite style violations"
          git push origin HEAD:spip/p0-01-opportunity-analyzer
