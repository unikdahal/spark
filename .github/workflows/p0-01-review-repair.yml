name: P0-01 temporary review repair

on:
  push:
    branches:
      - spip/p0-01-opportunity-analyzer

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: spip/p0-01-opportunity-analyzer

      - name: Apply listener lifecycle repairs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | python3
          git diff --check

      - name: Commit reviewed source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sql/core/src/main/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryOpportunityAnalyzer.scala \
            sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryOpportunityAnalyzerSuite.scala
          git commit -m "Bound listener lifecycle and exclude failed queries"
          git push origin HEAD:spip/p0-01-opportunity-analyzer
